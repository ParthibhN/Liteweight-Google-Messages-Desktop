name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Framework-Dependent Single-File Executable
        run: |
          dotnet publish -c Release -r win-x64 --no-self-contained -p:PublishSingleFile=true -o ./dist/framework-dependent

      - name: Publish Self-Contained Single-File Executable
        run: |
          dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o ./dist/self-contained

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GoogleMessagesDesktop-Builds
          path: |
            ./dist/framework-dependent/GoogleMessagesDesktop.exe
            ./dist/self-contained/GoogleMessagesDesktop.exe

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./dist/framework-dependent/GoogleMessagesDesktop.exe
            ./dist/self-contained/GoogleMessagesDesktop.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
